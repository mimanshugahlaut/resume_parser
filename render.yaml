services:
  - type: web
    name: resumeiq-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://resumeiq-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /health

  - type: static
    name: resumeiq-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://resumeiq-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
