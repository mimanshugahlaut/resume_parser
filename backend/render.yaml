services:
  - type: web
    name: resumeiq-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free
    healthCheckPath: /
